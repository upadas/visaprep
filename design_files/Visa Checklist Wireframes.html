<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Visa Checklist — Wireframes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --ink-soft:#3a3a3a;
    --pencil:#4a4a4a;
    --paper:#fafaf6;
    --paper-2:#f3f1e8;
    --rule:#1a1a1a;
    --accent:#2547d0;     /* sketch blue, used sparingly */
    --accent-2:#d04a2a;   /* sketch red */
    --accent-3:#e8b84a;   /* highlighter */
    --muted:#8a8a82;
  }
  html, body { background:#e9e6dd; color:var(--ink); }
  body { font-family: "Kalam", "Architects Daughter", system-ui, sans-serif; }

  /* ---------- Wireframe primitives ---------- */
  .wf {
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--rule);
    border-radius: 6px;
    box-shadow: 4px 4px 0 var(--rule);
    overflow:hidden;
    position:relative;
  }
  .wf-inner { padding: 28px 30px 36px; }
  .wf .browser-bar {
    display:flex; align-items:center; gap:8px;
    padding:8px 12px;
    border-bottom: 1.5px solid var(--rule);
    background: var(--paper-2);
    font-family:"Kalam"; font-size:13px; color:var(--pencil);
  }
  .wf .browser-bar .dots { display:flex; gap:5px; }
  .wf .browser-bar .dots span {
    width:10px; height:10px; border-radius:50%;
    border:1.5px solid var(--rule); background:transparent;
  }
  .wf .browser-bar .url {
    flex:1;
    border:1.5px solid var(--rule);
    border-radius: 999px;
    background:var(--paper);
    padding: 3px 12px;
    margin:0 8px;
    font-family:"Kalam"; font-size:12px;
  }

  /* sketchy headings */
  .wf h1, .wf h2, .wf h3, .wf h4 {
    font-family: "Caveat", cursive;
    color: var(--ink);
    margin: 0;
    line-height: 1.05;
    font-weight: 700;
  }
  .wf h1 { font-size: 38px; letter-spacing:-0.5px; line-height:1.3; padding-bottom:14px; margin-bottom: 18px; }
  .wf h2 { font-size: 26px; }
  .wf h3 { font-size: 20px; }
  .wf h4 { font-size: 17px; }

  .wf p, .wf li, .wf .body { font-family:"Kalam"; font-size:13.5px; line-height:1.45; color:var(--ink-soft); }
  .wf small, .wf .small { font-family:"Kalam"; font-size:11.5px; color:var(--pencil); }

  /* placeholder lines */
  .lines { display:flex; flex-direction:column; gap:6px; }
  .line {
    height: 8px;
    background: repeating-linear-gradient(90deg, var(--ink-soft) 0 4px, transparent 4px 7px);
    opacity:.55;
    border-radius: 2px;
  }
  .line.short { width: 60%; }
  .line.med   { width: 82%; }
  .line.long  { width: 100%; }

  /* boxes */
  .box {
    border: 1.8px solid var(--rule);
    border-radius: 6px;
    padding: 14px;
    background: var(--paper);
  }
  .box.shadow { box-shadow: 3px 3px 0 var(--rule); }
  .box.dashed { border-style: dashed; }
  .box.fill   { background: var(--paper-2); }
  .box.tinted { background: #eef1ff; border-color: var(--accent); }
  .box.warn   { background: #fdeee9; border-color: var(--accent-2); }
  .box.hi     { background: #fff4d3; }

  /* nav */
  .nav {
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:14px; border-bottom: 1.5px solid var(--rule);
    margin-bottom: 22px;
  }
  .nav .logo {
    font-family:"Caveat"; font-size:22px; font-weight:700;
    border:1.8px solid var(--rule); padding: 2px 10px; border-radius:4px;
    background:#fff4d3;
  }
  .nav ul { display:flex; gap:18px; list-style:none; padding:0; margin:0; font-size:13px; }
  .nav .cta {
    border:1.8px solid var(--rule); padding: 4px 12px; border-radius:4px;
    background:var(--ink); color:var(--paper); font-family:"Caveat"; font-size:16px;
    box-shadow: 2px 2px 0 var(--rule);
  }

  /* breadcrumb */
  .crumbs { font-size:12px; color:var(--pencil); margin-bottom:6px; }
  .crumbs span { text-decoration: underline wavy; text-underline-offset: 3px; }

  /* checklist item */
  .check { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1.5px dashed var(--rule); }
  .check:last-child { border-bottom:0; }
  .check .cb {
    width: 18px; height:18px; border:1.8px solid var(--rule); border-radius:3px;
    flex:0 0 18px; margin-top:2px; background:var(--paper);
  }
  .check .cb.done { background: var(--ink); position:relative; }
  .check .cb.done::after {
    content:"✓"; color:var(--paper); position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
  }
  .check .body-txt { flex:1; }
  .check .meta { font-size:11px; color:var(--pencil); margin-top:2px; }

  /* tag/pill */
  .pill {
    display:inline-block;
    border:1.5px solid var(--rule); border-radius: 999px;
    padding: 1px 9px; font-size: 11px; font-family:"Kalam";
    background: var(--paper); margin-right:5px;
  }
  .pill.b { background:#eef1ff; }
  .pill.y { background:#fff4d3; }
  .pill.r { background:#fdeee9; }

  /* annotation */
  .anno {
    position:absolute;
    font-family:"Caveat";
    font-size: 16px;
    color: var(--accent);
    pointer-events:none;
    line-height:1.1;
  }
  .anno::before {
    content:"";
    display:inline-block;
    width: 30px; height: 1.5px;
    background: var(--accent);
    vertical-align: middle;
    margin-right: 6px;
  }
  .anno.flip::before { display:none; }
  .anno.flip::after {
    content:"";
    display:inline-block;
    width: 30px; height: 1.5px;
    background: var(--accent);
    vertical-align: middle;
    margin-left: 6px;
  }

  /* progress */
  .progress {
    height: 12px; border:1.5px solid var(--rule); border-radius:99px;
    background: var(--paper); position:relative; overflow:hidden;
  }
  .progress > i {
    display:block; height:100%;
    background: repeating-linear-gradient(45deg, var(--ink) 0 4px, var(--ink-soft) 4px 8px);
  }

  /* CTA button mock */
  .btn {
    display:inline-flex; align-items:center; gap:6px;
    border:1.8px solid var(--rule); padding:6px 14px; border-radius:4px;
    background:var(--paper); font-family:"Caveat"; font-size:18px;
    box-shadow: 2px 2px 0 var(--rule);
  }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.accent  { background: #fff4d3; }

  /* Faux table rows */
  .row { display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:8px; padding:6px 0; border-bottom:1.5px dashed var(--rule); font-size:12px; }
  .row.head { font-family:"Caveat"; font-size:15px; border-bottom:2px solid var(--rule); }

  /* Sketch icon */
  .ico {
    width: 22px; height: 22px;
    border:1.8px solid var(--rule); border-radius:4px;
    display:inline-flex; align-items:center; justify-content:center;
    font-size: 12px; background:var(--paper);
  }

  /* faq */
  .faq-row { border-bottom:1.5px solid var(--rule); padding: 9px 0; display:flex; justify-content:space-between; gap:10px; }
  .faq-row .q { font-family:"Caveat"; font-size:18px; }
  .faq-row .x { font-family:"Caveat"; font-size:22px; color:var(--pencil); }

  /* Ad strip */
  .ad {
    border:2px dashed var(--rule);
    padding: 14px;
    text-align:center;
    font-family:"Caveat"; font-size:18px;
    background: repeating-linear-gradient(45deg, transparent 0 8px, rgba(0,0,0,0.04) 8px 9px);
    color: var(--pencil);
  }

  /* scribble underline for headlines */
  .squig { position:relative; display:inline-block; }
  .squig::after{
    content:""; position:absolute; left:-2px; right:-2px; bottom:-4px; height:6px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 6'><path d='M0 3 Q 7 0 14 3 T 28 3 T 42 3 T 60 3' fill='none' stroke='%23e8b84a' stroke-width='3' stroke-linecap='round'/></svg>") repeat-x;
    background-size: 60px 6px;
  }

  /* page label tag */
  .page-tag {
    position:absolute; top:-14px; left:18px;
    background: var(--ink); color: var(--paper);
    font-family:"Caveat"; font-size:18px; padding: 2px 12px; border-radius: 4px;
    box-shadow: 2px 2px 0 var(--pencil);
  }

  /* download card */
  .dl {
    border:1.8px solid var(--rule); border-radius:6px; padding:12px;
    background: linear-gradient( to right, #fff4d3 0%, #fff4d3 6px, var(--paper) 6px);
    display:flex; gap:12px; align-items:center;
    box-shadow: 3px 3px 0 var(--rule);
  }

  /* Sticky side rail */
  .rail-item { padding: 6px 8px; border-left: 3px solid transparent; font-size:13px; }
  .rail-item.active { border-color: var(--ink); font-weight:700; background: #fff4d3; }

  /* Hero variants */
  .badge {
    display:inline-block;
    border:1.5px solid var(--rule); padding: 1px 9px; border-radius:99px;
    font-family:"Kalam"; font-size:11px; background: var(--paper);
    text-transform: uppercase; letter-spacing:0.06em;
  }

  /* misc */
  .grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .grid-3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:14px; }
  .grid-4 { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .stack-sm > * + * { margin-top: 8px; }
  .stack > * + * { margin-top: 14px; }
  .stack-lg > * + * { margin-top: 22px; }
  .between { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .center { text-align:center; }
  .muted { color: var(--muted); }
  .sticky-card { position:sticky; top: 14px; }
  hr.rule { border:0; border-top:1.5px solid var(--rule); margin:14px 0; }
  hr.rule.thick { border-top:2.5px solid var(--rule); }

  /* full-bleed strip */
  .strip {
    margin: 18px -30px;
    padding: 18px 30px;
    background: var(--paper-2);
    border-top: 1.5px solid var(--rule);
    border-bottom: 1.5px solid var(--rule);
  }
  .strip.dark { background: var(--ink); color: var(--paper); }
  .strip.dark p, .strip.dark h2, .strip.dark h3 { color: var(--paper); }

  /* subtle paper grain */
  .wf::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1.2px);
    background-size: 4px 4px;
    mix-blend-mode: multiply;
    opacity: .5;
  }

  /* Tabs */
  .tabs { display:flex; border-bottom: 1.5px solid var(--rule); gap:0; margin-bottom: 14px; }
  .tabs .tab {
    padding: 6px 14px; border:1.5px solid var(--rule); border-bottom:0;
    border-radius: 6px 6px 0 0; margin-right: -1px; margin-bottom: -1.5px;
    background: var(--paper-2); font-family:"Caveat"; font-size:18px;
    color: var(--pencil);
  }
  .tabs .tab.active { background: var(--paper); color: var(--ink); border-bottom:1.5px solid var(--paper); }
</style>
</head>
